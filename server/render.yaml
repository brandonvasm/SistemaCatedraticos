services:
  - type: web
    name: faculty-engine-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash -c "python manage.py migrate && gunicorn api.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: api.settings
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: faculty-engine-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: faculty-engine-redis
          property: connectionString

  - type: worker
    name: faculty-engine-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A api worker -l info --pool=prefork --concurrency=2
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: faculty-engine-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: faculty-engine-redis
          property: connectionString

  - type: redis
    name: faculty-engine-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
